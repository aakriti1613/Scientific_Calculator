<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scientific Calculator — Modern UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Calcy.css" />

</head>

<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-container">
    <div class="nav-left">
      <div class="nav-logo">MathMental</div>
    </div>

    <div class="nav-right">
      <button id="navToggle" class="nav-toggle" aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <ul class="nav-menu" id="navMenu" role="menu">
        <li role="none">
          <a role="menuitem" href="#" onclick="location.reload()">Scientific Calculator</a>
        </li>
        <li role="none">
          <a role="menuitem" href="#" onclick="window.location.href='calculus.html'">Calculus</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

    <div class="page">
        <div class="calc-card" role="application" aria-label="Scientific calculator">
            <div class="header">
                <div class="title">
                    <h1>Scientific Calculator</h1>
                    <span class="muted">Modern • Responsive • Keyboard-friendly</span>
                </div>
                <div>
                    <button id="modeToggle" class="btn-key small gray" title="Toggle Deg/Rad">Deg</button>
                </div>
            </div>

            <!-- Display -->
            <div class="display" id="display">
                <div id="expression" aria-live="polite"></div>
                <div id="number" aria-live="assertive"></div>
            </div>

            <!-- Buttons grid (keeps same data-event_key values so backend works) -->
            <div class="keys" id="keys">
                <!-- Row 1 -->
                <button class="btn-key small" data-event_key="sin⁻¹(">sin<sup>-1</sup></button>
                <button class="btn-key small" data-event_key="cos⁻¹(">cos<sup>-1</sup></button>
                <button class="btn-key small" data-event_key="tan⁻¹(">tan<sup>-1</sup></button>
                <button class="btn-key small" data-event_key="sinh(">sinh</button>
                <button class="btn-key small" data-event_key="cosh(">cosh</button>

                <!-- Row 2 -->
                <button class="btn-key small" data-event_key="sin(">sin</button>
                <button class="btn-key small" data-event_key="cos(">cos</button>
                <button class="btn-key small" data-event_key="tan(">tan</button>
                <button class="btn-key small" data-event_key="log(">log</button>
                <button class="btn-key small" data-event_key="ln(">ln</button>

                <!-- Row 3 -->
                <button class="btn-key small" data-event_key="%">%</button>
                <button class="btn-key small" data-event_key="e">e</button>
                <button class="btn-key small" data-event_key="π">π</button>
                <button class="btn-key small" data-event_key="^">x<sup>y</sup></button>
                <button class="btn-key small" data-event_key="1/">1/x</button>

                <!-- Row 4 -->
                <button class="btn-key small" data-event_key="!">x!</button>
                <button class="btn-key small" data-event_key="∛("><sup>3</sup>√</button>
                <button class="btn-key small" data-event_key="√(">√</button>
                <button class="btn-key small" data-event_key="(">(</button>
                <button class="btn-key small" data-event_key=")">)</button>

                <!-- Row 5 (numbers) -->
                <button class="btn-key" data-event_key="7">7</button>
                <button class="btn-key" data-event_key="8">8</button>
                <button class="btn-key" data-event_key="9">9</button>
                <button class="btn-key gray" data-event_key="Backspace" title="Backspace"><i
                        class="fa-solid fa-delete-left"></i></button>
                <button class="btn-key gray" data-event_key="Delete" title="Clear"><i
                        class="fa-solid fa-eraser"></i></button>

                <button class="btn-key" data-event_key="4">4</button>
                <button class="btn-key" data-event_key="5">5</button>
                <button class="btn-key" data-event_key="6">6</button>
                <button class="btn-key op" data-event_key="*"><i class="fa-solid fa-xmark"></i></button>
                <button class="btn-key op" data-event_key="/"><i class="fa-solid fa-divide"></i></button>

                <button class="btn-key" data-event_key="1">1</button>
                <button class="btn-key" data-event_key="2">2</button>
                <button class="btn-key" data-event_key="3">3</button>
                <button class="btn-key op" data-event_key="+"><i class="fa-solid fa-plus"></i></button>
                <button class="btn-key op" data-event_key="-"><i class="fa-solid fa-minus"></i></button>

                <button class="btn-key small" data-event_key="0">0</button>
                <button class="btn-key small" data-event_key=".">.</button>
                <button class="btn-key small" data-event_key=" * 10^">×10^</button>
                <button class="btn-key equal accent span-2" data-event_key="="><i class="fa-solid fa-equals"></i>
                </button>
            </div>

            <div class="footer">
                <div class="muted">© 2025 Akriti Jha</div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="Calcy.js"></script>
</body>

</html>
